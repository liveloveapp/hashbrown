name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable release tag to publish (vX.Y.Z)
        required: true
        type: string
  push:
    tags:
      - npm/preview
      - npm/latest

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Publish packages to npm
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Manual publication requires an existing stable vX.Y.Z release tag.' >&2
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Verify manual release source
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
          node scripts/verify-release-versions.mjs --tag "$RELEASE_TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm 11 for trusted publishing
        run: npm install -g npm@11

      - name: Determine affected base
        if: github.event_name != 'workflow_dispatch'
        uses: nrwl/nx-set-shas@v5

      - name: Install dependencies
        run: npm ci

      - name: Setup .NET for integration checks
        if: hashFiles('tools/conformance/dotnet/global.json') != ''
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: tools/conformance/dotnet/global.json
          cache: true
          cache-dependency-path: tools/conformance/dotnet/packages.lock.json

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Determine release channel
        id: channel
        run: |
          case "${GITHUB_REF_NAME}" in
            npm/preview)
              echo "dist_tag=next" >> "$GITHUB_OUTPUT"
              ;;
            npm/latest)
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Lint and test affected projects
        if: github.event_name != 'workflow_dispatch'
        run: npx nx affected -t lint,test --parallel=3

      - name: Lint and test release projects
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx nx run-many -t lint,test -p angular anthropic azure bedrock core google ollama openai react typesafe dotnet-conformance vercel-bootstrap --parallel=3
          npx nx run react:eslint:lint

      - name: Verify atomic release versions
        run: node scripts/verify-release-versions.mjs

      - name: Build release packages
        run: npx nx run-many -t build -p angular anthropic azure bedrock core google ollama openai react typesafe --parallel=3

      - name: Publish packages
        run: npx nx release publish --tag=${{ steps.channel.outputs.dist_tag }} --access=public --parallel=1

      - name: Verify npm release
        run: node scripts/verify-npm-release.mjs --tag=${{ steps.channel.outputs.dist_tag }}
