name: PR / Main CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-main-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Determine affected base
        uses: nrwl/nx-set-shas@v3

      - name: Install dependencies
        run: npm ci

      - name: Validate dependency tree
        run: npm ls --all

      - name: Test Cloudflare deployment tooling
        run: npx nx test cloudflare-deployment

      - name: Validate affected projects
        run: npx nx affected -t lint,test,typecheck,build,e2e --parallel=3

      - name: Validate smart-home React tooling
        run: npx nx run-many -t eslint:lint,build-storybook -p smart-home-react --parallel=2

  cloudflare-preview:
    name: Cloudflare Preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy affected previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tools/cloudflare/deploy.mjs preview
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --pr "${{ github.event.pull_request.number }}"

      - name: Diagnose Docs preview runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          preview_url="https://pr-${{ github.event.pull_request.number }}.hashbrown-www.pages.dev"
          log_file="$(mktemp)"
          response_file="$(mktemp)"

          timeout 45s npx wrangler pages deployment tail "$preview_url" \
            --format=pretty --status=error > "$log_file" 2>&1 &
          tail_pid="$!"

          sleep 8
          status="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' \
            "$preview_url/docs/angular/start/quick")"
          sleep 8

          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" || true
          cat "$log_file"
          cat "$response_file"

          test "$status" = 200

  cloudflare-production:
    name: Cloudflare Production
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whether commit is current main
        id: current-main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"

          if [[ "$current_sha" == "$EXPECTED_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded production deployment: main is now $current_sha."
          fi

      - name: Deploy production
        if: steps.current-main.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/cloudflare/deploy.mjs production --sha "${{ github.sha }}"

  pr-gate:
    name: PR Gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [ci, cloudflare-preview]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CI_RESULT: ${{ needs.ci.result }}
          PREVIEW_RESULT: ${{ needs.cloudflare-preview.result }}
        run: |
          if [[ "$CI_RESULT" != "success" ]]; then
            echo "Validation result: $CI_RESULT"
            exit 1
          fi

          if [[ "$PREVIEW_RESULT" != "success" && "$PREVIEW_RESULT" != "skipped" ]]; then
            echo "Preview result: $PREVIEW_RESULT"
            exit 1
          fi
