name: PR / Main CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # `labeled` so adding the `preview` label deploys a preview right away.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  # One group per pull request, and one shared group for every run on main
  # (push or manual dispatch) so production runs are strictly ordered.
  group: pr-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Deployment targets: key = Nx project, dir = directory containing .vercel/output,
  # project_id_secret = repository secret holding that target's Vercel project ID.
  # builder "vercel" = build the Next.js app in `root` with `vercel build`;
  # optional = skip while the project secret is unset (see deploy.yml).
  DEPLOY_TARGETS: '[{"key":"www","dir":".","project_id_secret":"VERCEL_PROJECT_ID_WWW","builder":"vercel","root":"www"},{"key":"atc","dir":"examples/atc","project_id_secret":"VERCEL_PROJECT_ID_ATC"},{"key":"lifecycle","dir":"tools/lifecycle","project_id_secret":"VERCEL_PROJECT_ID_LIFECYCLE","optional":true},{"key":"workbench","dir":"tools/workbench","project_id_secret":"VERCEL_PROJECT_ID_WORKBENCH","optional":true}]'

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOTNET_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Username=postgres;Password=fixture-only;Database=postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Determine affected base
        uses: nrwl/nx-set-shas@v5

      - name: Install dependencies
        run: npm ci

      - name: Select .NET conformance
        id: dotnet
        shell: bash
        run: |
          set -euo pipefail
          affected="$(npx nx show projects --affected --json)"
          required="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).includes("dotnet-conformance") ? "true" : "false")' "$affected")"
          if [[ -n "$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- .github/workflows/pr-main.yml)" ]]; then
            required=true
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: Setup .NET for affected integration
        if: steps.dotnet.outputs.required == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: tools/conformance/dotnet/global.json
          cache: true
          cache-dependency-path: tools/conformance/dotnet/packages.lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate dependency tree
        run: npm ls --all

      - name: Validate affected projects
        run: npx nx affected -t lint,test,typecheck,build,e2e,install-pack-e2e --parallel=3

      - name: Run affected conformance suites
        run: npx nx affected -t example-e2e --parallel=1

      - name: Run .NET provider conformance
        if: steps.dotnet.outputs.required == 'true'
        run: npx nx provider-e2e dotnet-conformance

      - name: Run genuine native approval browser regression without a model provider
        if: steps.dotnet.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          prepare_log="$RUNNER_TEMP/native-approval-consumer-prepare.log"
          npx nx prepare-live-consumer dotnet-conformance --output-style=static 2>&1 | tee "$prepare_log"
          consumer_metadata="$(node - "$prepare_log" "$RUNNER_TEMP" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const lines = fs.readFileSync(process.argv[2], 'utf8').split(/\r?\n/);
          const parent = fs.realpathSync(process.argv[3]);
          let selected;
          for (const line of lines.reverse()) {
            let value;
            try { value = JSON.parse(line); } catch { continue; }
            if (value && typeof value === 'object' && typeof value.metadataPath === 'string') {
              selected = value;
              break;
            }
          }
          if (!selected || !path.isAbsolute(selected.metadataPath) || /[\r\n]/.test(selected.metadataPath)) {
            throw Error('No valid final consumer metadata record in prepare output');
          }
          const metadata = fs.realpathSync(selected.metadataPath);
          if (!metadata.startsWith(parent + path.sep) || metadata !== path.join(fs.realpathSync(selected.directory), 'consumer-metadata.json')) {
            throw Error('Consumer metadata escaped the runner temp installation');
          }
          const baseline = JSON.parse(fs.readFileSync(metadata, 'utf8'));
          if (baseline.metadataPath !== selected.metadataPath || JSON.stringify(baseline.artifacts) !== JSON.stringify(selected.artifacts)) {
            throw Error('Prepare output and persisted consumer metadata differ');
          }
          process.stdout.write(metadata);
          NODE
          )"
          HASHBROWN_LOCAL_NATIVE_CONSUMER_METADATA="$consumer_metadata" npx nx local-native-approval-browser dotnet-conformance --output-style=static

      - name: Upload runtime smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-example-diagnostics
          path: |
            test-results/examples
            playwright-report/examples
            test-results/conformance
            playwright-report/conformance
            test-results/atc
            playwright-report/atc
          retention-days: 7
          if-no-files-found: ignore

  targets:
    name: Select deployment targets
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Select targets
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          NX_DAEMON: 'false'
        run: |
          set -o pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            selected="$(jq -c . <<<"$DEPLOY_TARGETS")"
          elif git diff --name-only "$BASE...$HEAD" | grep -qxE '\.github/workflows/(pr-main|deploy)\.yml'; then
            echo "Deployment workflow changed; selecting all targets."
            selected="$(jq -c . <<<"$DEPLOY_TARGETS")"
          else
            affected="$(npx nx show projects --affected --base="$BASE" --head="$HEAD" --withTarget=build --type=app --json | tail -n1 | jq -c .)"
            selected="$(jq -c --argjson affected "$affected" \
              '[ .[] | select(.key as $key | $affected | index($key) != null) ]' <<<"$DEPLOY_TARGETS")"
          fi
          echo "Selected targets: $selected"
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"

  # Previews are opt-in (label a PR `preview`) and never block a merge: the
  # Vercel Hobby plan allows 5000 file uploads a day per account, and a
  # refused upload shouldn't hold up CI.
  preview:
    name: Preview
    needs: [ci, targets]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      needs.targets.outputs.matrix != '' &&
      needs.targets.outputs.matrix != '[]'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
      targets: ${{ needs.targets.outputs.matrix }}
      ref: ${{ github.event.pull_request.head.sha }}
      branch: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  production:
    name: Production
    needs: [ci, targets]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.targets.outputs.matrix != '' &&
      needs.targets.outputs.matrix != '[]'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      targets: ${{ needs.targets.outputs.matrix }}
      ref: ${{ github.sha }}
      branch: main
    secrets: inherit

  # Dashboards-as-code drift check. Runs only when tools/posthog changed, with
  # the read-only key; forks and runs without the secret skip it (neutral).
  # Not part of the PR gate: PostHog being unreachable must not block a merge.
  posthog-sync-plan:
    name: PostHog sync plan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: '1'
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY_READONLY }}
      POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
      POSTHOG_HOST: https://us.i.posthog.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect PostHog changes
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^tools/posthog/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "tools/posthog did not change; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for read-only credentials
        id: secrets
        if: steps.changed.outputs.run == 'true'
        run: |
          if [ -z "${POSTHOG_PERSONAL_API_KEY:-}" ] || [ -z "${POSTHOG_PROJECT_ID:-}" ]; then
            echo "::notice::PostHog secrets are not available; skipping the sync plan."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.secrets.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        if: steps.secrets.outputs.run == 'true'
        run: npm ci

      - name: Plan dashboard sync
        if: steps.secrets.outputs.run == 'true'
        run: npx nx run posthog:sync:plan

  pr-gate:
    name: PR Gate
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [ci, targets, preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          CI_RESULT: ${{ needs.ci.result }}
          TARGETS_RESULT: ${{ needs.targets.result }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
        run: |
          if [[ "$CI_RESULT" != "success" ]]; then
            echo "Validation result: $CI_RESULT"
            exit 1
          fi

          if [[ "$TARGETS_RESULT" != "success" && "$TARGETS_RESULT" != "skipped" ]]; then
            echo "Target selection result: $TARGETS_RESULT"
            exit 1
          fi

          # Previews are informational: a failed deploy (for example Vercel's
          # daily upload limit) is reported but doesn't block the merge.
          if [[ "$PREVIEW_RESULT" != "success" && "$PREVIEW_RESULT" != "skipped" ]]; then
            echo "::warning::Preview deployment result: $PREVIEW_RESULT (not required for merge)."
          fi
