name: PR / Main CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # One group per pull request, and one shared group for every run on main
  # (push or manual dispatch) so production runs are strictly ordered.
  group: pr-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Deployment targets: key = Nx project, dir = directory containing .vercel/output,
  # project_id_secret = repository secret holding that target's Vercel project ID.
  # builder "vercel" = build with `vercel build` (Next.js); optional = skip while
  # the project secret is unset (see .github/workflows/deploy.yml).
  DEPLOY_TARGETS: '[{"key":"www","dir":".","project_id_secret":"VERCEL_PROJECT_ID_WWW"},{"key":"invoicing","dir":"examples/invoicing","project_id_secret":"VERCEL_PROJECT_ID_INVOICING"},{"key":"www-next","dir":".","project_id_secret":"VERCEL_PROJECT_ID_WWW_NEXT","builder":"vercel","optional":true}]'

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Determine affected base
        uses: nrwl/nx-set-shas@v3

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate dependency tree
        run: npm ls --all

      - name: Validate affected projects
        run: npx nx affected -t lint,test,typecheck,build,e2e --parallel=3

      - name: Verify affected real examples
        run: npx nx affected -t example-e2e --parallel=1

      - name: Upload runtime smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: canonical-example-diagnostics
          path: |
            test-results/examples
            playwright-report/examples
            test-results/invoicing
            playwright-report/invoicing
          retention-days: 7
          if-no-files-found: ignore

  targets:
    name: Select deployment targets
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Select targets
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          NX_DAEMON: 'false'
        run: |
          set -o pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            selected="$(jq -c . <<<"$DEPLOY_TARGETS")"
          elif git diff --name-only "$BASE...$HEAD" | grep -qxE '\.github/workflows/(pr-main|deploy)\.yml'; then
            echo "Deployment workflow changed; selecting all targets."
            selected="$(jq -c . <<<"$DEPLOY_TARGETS")"
          else
            affected="$(npx nx show projects --affected --base="$BASE" --head="$HEAD" --withTarget=build --type=app --json | tail -n1 | jq -c .)"
            selected="$(jq -c --argjson affected "$affected" \
              '[ .[] | select(.key as $key | $affected | index($key) != null) ]' <<<"$DEPLOY_TARGETS")"
          fi
          echo "Selected targets: $selected"
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"

  preview:
    name: Preview
    needs: [ci, targets]
    if: >-
      github.event_name == 'pull_request' &&
      needs.targets.outputs.matrix != '' &&
      needs.targets.outputs.matrix != '[]'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: preview
      targets: ${{ needs.targets.outputs.matrix }}
      ref: ${{ github.event.pull_request.head.sha }}
      branch: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  production:
    name: Production
    needs: [ci, targets]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.targets.outputs.matrix != '' &&
      needs.targets.outputs.matrix != '[]'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      targets: ${{ needs.targets.outputs.matrix }}
      ref: ${{ github.sha }}
      branch: main
    secrets: inherit

  pr-gate:
    name: PR Gate
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [ci, targets, preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          CI_RESULT: ${{ needs.ci.result }}
          TARGETS_RESULT: ${{ needs.targets.result }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
        run: |
          if [[ "$CI_RESULT" != "success" ]]; then
            echo "Validation result: $CI_RESULT"
            exit 1
          fi

          if [[ "$TARGETS_RESULT" != "success" && "$TARGETS_RESULT" != "skipped" ]]; then
            echo "Target selection result: $TARGETS_RESULT"
            exit 1
          fi

          if [[ "$PREVIEW_RESULT" != "success" && "$PREVIEW_RESULT" != "skipped" ]]; then
            echo "Preview result: $PREVIEW_RESULT"
            exit 1
          fi
